name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Unsigned .app
        run: |
          xcodebuild -project DopamineLARPMINE.xcodeproj \
            -scheme DopamineLARPMINE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DopamineLARPMINE.app Payload/
          zip -qry Dopamine-LARPMINE.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-LARPMINE-IPA
          path: Dopamine-LARPMINE.ipa
